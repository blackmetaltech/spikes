name: ci
# Runs inside the prebuilt toolchain image ghcr.io/blackmetaltech/spike-build:<tag> (built by toolchain.yml; NEST static + PyNEST, NESTML venv, godot-cpp, Godot
# are already in it), so a run only compiles the engine, extension and tests: ~15-25 min. If the image for the current pins does not exist yet, the job
# fails at once with instructions (run the toolchain workflow, then re-run) rather than silently spending ~1.5 h building it.
# Budget: docs-only and website-only pushes do not run; one run per ref (newer pushes cancel older ones); push runs on master only, other branches run via their pull request.
on:
  push:
    branches: [master]
    paths-ignore: &ignore
      - 'docs/**'
      - 'research/**'
      - '**.md'
      - 'site/**'                       # the website: pages.yml builds and deploys it
      - 'tools/site/**'
      - 'scripts/site-media.sh'
      - '.github/workflows/pages.yml'
      - '.github/workflows/release.yml'   # the release build runs on tags, not here
  pull_request:
    paths-ignore: *ignore
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120   # build ~19 min, ctest ~35 min, then smoke and package on a 4-core runner: 60 cut the run off mid-smoke
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain image
        run: |
          tag=$(scripts/toolchain-tag.sh); img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/spike-build:$tag"
          echo "SPIKE_IMAGE=$img" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$img" || {
            echo "::error::Toolchain image $img not found. The Dockerfile or a pin script (scripts/build-nest.sh, build-nestml.sh, build-gd.sh, prebuilt.sh) changed and the image for those pins has not been published. Run the 'toolchain' workflow (Actions > toolchain > Run workflow, ~1.5 h), then re-run this job."
            exit 1; }

      # Every step runs in the image with the checkout mounted at /src. The image's NEST/NESTML/godot-cpp trees are linked into third_party/ by the build scripts.
      - name: Build (engine, extension, tests; PyNEST for the Python parity tests)
        run: docker run --rm -v "$PWD":/src -w /src "$SPIKE_IMAGE" scripts/build-all.sh --tests --debug --pynest

      - name: ctest
        run: |
          docker run --rm -v "$PWD":/src -w /src "$SPIKE_IMAGE" \
            bash -c 'cd build && ctest --output-on-failure -j"$(nproc)"'

      - name: pytest
        run: |
          docker run --rm -v "$PWD":/src -w /src "$SPIKE_IMAGE" \
            bash -c 'export SPIKE_RUN=/src/godot/bin/spike-run; python3 -m pytest -q python/tests'

      - name: Smoke (headless game, every screen and task)
        run: docker run --rm -v "$PWD":/src -w /src "$SPIKE_IMAGE" scripts/smoke.sh

      - name: Package (Linux zip + headless smoke of the exported build)
        run: docker run --rm -v "$PWD":/src -w /src "$SPIKE_IMAGE" scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: spike-linux-x86_64
          path: build/spike-linux-x86_64.zip
          if-no-files-found: error

  # Windows x86_64 is planned (docs: README "Windows"): NEST + GSL + godot-cpp need a MinGW or MSVC toolchain and the
  # engine's POSIX bits (realpath, dladdr, fork/exec in the headless runner) need Windows ports first.
