name: release
# Push a tag v<version> (matching config/version in godot/project.godot) and this builds one zip per platform, smoke-tests each zip (every screen,
# CHECK through the bundled spike-run) and publishes a GitHub Release with them. Linux builds in the toolchain image (scripts/package.sh); macOS on
# GitHub's Apple Silicon runners (build-macos.yml); Windows on a Windows runner with MSYS2 (build-windows.yml). The release is published only if every platform passed. The website's download buttons
# (site/app.js) read the latest release and link straight to the zips. Run by hand (workflow_dispatch) it only builds and uploads the zips as artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write    # create the release
  packages: read     # pull the toolchain image

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          v=$(sed -n 's/^config\/version="\(.*\)"/\1/p' godot/project.godot)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "::error::tag ${GITHUB_REF_NAME} does not match config/version \"$v\" in godot/project.godot"; exit 1; }
            grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $v"; exit 1; }
          fi

      - name: Toolchain image
        run: |
          tag=$(scripts/toolchain-tag.sh); img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/spike-build:$tag"
          echo "SPIKE_IMAGE=$img" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$img" || { echo "::error::Toolchain image $img not found: run the 'toolchain' workflow first."; exit 1; }

      - name: Build (engine, release extension, spike-run)
        run: docker run --rm -v "$PWD":/src -w /src "$SPIKE_IMAGE" scripts/build-all.sh

      - name: Package (Linux zip + smoke of the exported build)
        run: docker run --rm -v "$PWD":/src -w /src -e SKIP_BUILD=1 "$SPIKE_IMAGE" scripts/package.sh

      - name: Checksum
        run: |
          # build/ was written by the container as root: collect the files in a folder the runner owns
          mkdir -p dist && cp build/spike-linux-x86_64.zip dist/ && cd dist
          sha256sum spike-linux-x86_64.zip > spike-linux-x86_64.zip.sha256
          cat spike-linux-x86_64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: spike-linux-x86_64
          path: |
            dist/spike-linux-x86_64.zip
            dist/spike-linux-x86_64.zip.sha256
          if-no-files-found: error

  macos:
    uses: ./.github/workflows/build-macos.yml

  windows:
    uses: ./.github/workflows/build-windows.yml

  publish:
    needs: [linux, macos, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: spike-*
          merge-multiple: true

      - name: Notes
        run: |
          v=$(sed -n 's/^config\/version="\(.*\)"/\1/p' godot/project.godot)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          ls -la dist; (cd dist && sha256sum -c ./*.sha256)
          # the changelog entry of this version: from its heading to the next "## [" heading
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          {
            echo
            echo "## Install"
            echo
            echo 'Download the zip for your system below and extract it anywhere. No installer, no account.'
            echo
            echo '- **Linux x86_64** (glibc 2.39 / Ubuntu 24.04 or newer): `spike-linux-x86_64.zip`, then run `./Spike.x86_64`.'
            echo '- **macOS, Apple Silicon**: `spike-macos-arm64.zip`. The app is not notarized, so macOS blocks the first launch: open System Settings, Privacy & Security, and choose Open Anyway; or run `xattr -dr com.apple.quarantine Spike.app` once in a terminal.'
            echo '- **Windows x86_64** (10 or newer): `spike-windows-x86_64.zip`, then run `Spike.exe`. The exe is unsigned, so SmartScreen warns: More info, Run anyway.'
            echo
            echo 'Each zip has a `.sha256` beside it (`sha256sum -c <file>.sha256`).'
            echo
            echo "Website and wiki: https://spike.blackmetal.tech/"
          } >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --title "Spike $VERSION" --notes-file notes.md --verify-tag
